<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>yuti · 玉石心测 | 发现你的本命玉石</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f1f7ef 0%, #e2e6db 100%);
            font-family: 'Segoe UI', 'Noto Sans CJK SC', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            transition: all 0.2s;
        }

        /* 主容器 */
        .test-container {
            max-width: 980px;
            margin: 0 auto;
            background: #ffffffea;
            border-radius: 2rem;
            box-shadow: 0 25px 40px -12px rgba(60, 45, 30, 0.3);
            overflow: hidden;
            border: 1px solid #e2d9cf;
            transition: all 0.3s ease;
        }

        /* 头部区域 */
        .hero {
            background: #2d3e2b;
            background-image: radial-gradient(circle at 10% 20%, #3f5a38, #1e2a1c);
            color: #fef3d6;
            padding: 1.8rem 1.8rem;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.3rem;
            letter-spacing: 4px;
            font-weight: 600;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.2);
        }
        .hero p {
            opacity: 0.85;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        .rule-badge {
            background: #cbb87b;
            color: #1f2b1c;
            display: inline-block;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 0.7rem;
        }

        /* 统计栏 */
        .stats-panel {
            background: #fefaf0;
            border-bottom: 1px solid #e2d7c6;
            padding: 0.7rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .progress {
            background: #e5dfcf;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            color: #3a2c1f;
        }
        .option-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            background: #ffffffcc;
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }
        .stat-a { color: #2c6e2c; }
        .stat-b { color: #b88746; }
        .stat-c { color: #b5651e; }
        .stat-d { color: #8b5a2b; }
        .stat-null { color: #9e8d77; }

        /* 滚动题目区域 */
        .questions-area {
            padding: 1.8rem 1.8rem 1rem;
            max-height: 65vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .question-card {
            background: #fffff7;
            border: 1px solid #ece2d4;
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }
        .question-card:hover {
            border-color: #cbb87b;
            box-shadow: 0 8px 18px rgba(100, 70, 30, 0.08);
        }
        .q-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.9rem;
            color: #3a2a1e;
        }
        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-top: 0.3rem;
        }
        .opt-btn {
            flex: 1 0 100px;
            background: #fef9f0;
            border: 1px solid #e2cfb5;
            border-radius: 2rem;
            padding: 0.6rem 0.6rem;
            text-align: center;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            color: #5a3e28;
        }
        .opt-btn:hover {
            background: #f5e7d3;
            border-color: #b88b4a;
            transform: translateY(-1px);
        }
        .opt-active {
            background: #5f7c4b;
            border-color: #3e5d2a;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .action-bar {
            padding: 1rem 1.8rem 1.8rem;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            background: #ffffff;
            border-top: 1px solid #efe3d2;
        }
        button {
            border: none;
            padding: 0.7rem 1.6rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            background: #eae1d1;
            color: #3c2a1b;
        }
        .btn-primary {
            background: #b27d40;
            color: white;
            box-shadow: 0 4px 8px rgba(140, 90, 30, 0.2);
        }
        .btn-primary:hover {
            background: #c9944e;
            transform: translateY(-2px);
        }
        
        /* 独立结果页面样式 (全屏只显示结果) */
        .result-card {
            background: linear-gradient(115deg, #fff9ef, #fff6e8);
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            border-left: 8px solid #c7a252;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
            max-width: 780px;
            margin: 0 auto;
        }
        .jade-badge {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #2e5c2a;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #e5e0c3;
            padding: 0.3rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 1rem;
        }
        .jade-image {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: #f2e8d5;
        }
        .dimension-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 1.2rem 0;
        }
        .dim-item {
            background: #f5efdf;
            border-radius: 2rem;
            padding: 0.3rem 1.2rem;
            font-size: 0.85rem;
        }
        .culture-section {
            background: #f0ebd8;
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin: 1rem 0 0.5rem;
            border-left: 4px solid #c7a252;
        }
        .culture-section h4 {
            font-size: 0.95rem;
            color: #5a3e28;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .culture-section p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #4a3a28;
        }
        .retry-btn {
            background: #b27d40;
            color: white;
            margin-top: 1.5rem;
            display: inline-block;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 1rem;
            color: #9e8a6e;
            border-top: 1px solid #efeadb;
        }
        .hide {
            display: none !important;
        }
        @media (max-width: 650px) {
            .questions-area { padding: 1rem; }
            .opt-btn { flex: 1 0 75px; font-size: 0.75rem; }
            .jade-badge { font-size: 1.4rem; }
            .jade-image { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 主测试界面容器 (包含题目、统计等) -->
    <div id="testContainer" class="test-container">
        <div class="hero">
            <h1>🌿 yuti · 玉石心鉴</h1>
            <p>20题洞见内在气质 · 找到与你共鸣的灵玉</p>
        </div>

        <div class="stats-panel">
            <div class="progress">📜 进度: <span id="answeredCount">0</span> / <span id="totalCountSpan">20</span> 题</div>
            <div class="option-stats">
                <span class="stat-a" id="statA"> A:0</span>
                <span class="stat-b" id="statB"> B:0</span>
                <span class="stat-c" id="statC"> C:0</span>
                <span class="stat-d" id="statD"> D:0</span>
                <span class="stat-null" id="statNull">⚪ 未选:0</span>
            </div>
        </div>

        <div class="questions-area" id="questionsArea"></div>

        <div class="action-bar">
            <button id="resetBtn">🔄 重新测试</button>
            <button id="viewResultBtn" class="btn-primary">✨ 探寻本命玉石 ✨</button>
        </div>
    </div>

    <!-- 独立结果容器 (初始为空) -->
    <div id="resultContainer" style="display: none;"></div>
</div>

<script>
    // ---------- 20道题库 (完全匹配规则，维度内置用于计分) ----------
    const QUESTIONS = [
        { text: "参加完一场热闹的聚会后，你通常的感觉是？", options: ["非常兴奋，还想继续社交", "比较开心，但有点累", "有点消耗，需要独处一下", "很疲惫，希望尽快一个人待着"], dim: "EI", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "在项目团队讨论中，你更常扮演的角色是？", options: ["主动发言，带动气氛", "会发言，但不算最多", "多数时间在听，偶尔插话", "几乎只听不说"], dim: "EI", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "空闲时间，你更喜欢？", options: ["和朋友出去玩", "一两好友小聚", "一个人做喜欢的事", "完全独处，不被打扰"], dim: "EI", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "面对新布置的选修课期末作业，你通常？", options: ["马上开始行动，边做边想", "边做边调整", "想清楚方向再开始", "必须全部想清楚才行动"], dim: "EI", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "别人对你的评价更接近？", options: ["热情开朗", "比较健谈", "安静沉稳", "冷淡内敛"], dim: "EI", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "上选修课时，你看重授课内容中的？", options: ["具体数据和事实", "可验证的细节", "背后的含义与趋势", "抽象的可能性和灵感"], dim: "SN", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "你更喜欢哪种类型的小说/电影？", options: ["真实事件改编", "现实题材", "科幻或奇幻", "抽象、隐喻强烈的作品"], dim: "SN", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "学习了如何判断玉石好坏时，你更偏好？", options: ["按标准步骤操作", "示例和模板", "理解原理后再实践", "自由探索和试错"], dim: "SN", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "你容易被什么样的玉吸引？", options: ["朴素典雅的玉", "盘出包浆的玉", "颜色奇异的玉", "独具特色的玉"], dim: "SN", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "你对“明天”的态度更接近？", options: ["把今天的事做好就行", "按已知规律推测明天", "经常想象未来的可能性", "觉得未来充满未知与创造空间"], dim: "SN", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "当你和朋友发生冲突时，你更在意？", options: ["谁对谁错", "逻辑和道理", "对方的感受", "关系的和谐"], dim: "TF", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "假如你在买玉，你更容易被什么样的话说服？", options: ["逻辑严密的论证", "客观事实数据", "真诚的个人经历分享", "对方基于自己的判断"], dim: "TF", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "做重要决定时，你更依赖？", options: ["冷静分析利弊", "客观规则与标准", "内心感觉和价值观", "身边人的感受"], dim: "TF", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "你更容易被描述为？", options: ["理性冷静", "公正讲原则", "温暖体贴", "感性心软"], dim: "TF", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "你认为规则应该？", options: ["严格统一执行", "尽量保持逻辑一致", "根据人情适当调整", "完全因人因事而变"], dim: "TF", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "对一个即将到来的旅行，你通常？", options: ["详细计划到每一天", "设定大概框架", "只定大方向，细节随意", "完全不计划，走到哪是哪"], dim: "JP", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "你的桌面或工作空间通常是？", options: ["非常整齐，分类明确", "基本整洁", "有点乱但不影响找东西", "很乱但自己知道在哪"], dim: "JP", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "面对大作业截止日期，你更常？", options: ["提前很早完成", "按计划逐步推进", "最后几天集中完成", "最后一天才开始"], dim: "JP", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "你更喜欢？", options: ["事情尽早定下来", "有明确的结论", "留有余地和弹性", "尽可能保持开放选择"], dim: "JP", sA:2, sB:1, sC:-1, sD:-2 },
        { text: "别人可能评价你？", options: ["过于刻板/固执", "太讲规矩", "太随性/不靠谱", "太过散漫"], dim: "JP", sA:2, sB:1, sC:-1, sD:-2 }
    ];

    const TOTAL = QUESTIONS.length;
    let answers = new Array(TOTAL).fill(null);

    // DOM 元素
    const testContainer = document.getElementById("testContainer");
    const resultContainerDiv = document.getElementById("resultContainer");
    const questionsArea = document.getElementById("questionsArea");
    const answeredSpan = document.getElementById("answeredCount");
    const totalSpan = document.getElementById("totalCountSpan");
    const resetBtn = document.getElementById("resetBtn");
    const viewBtn = document.getElementById("viewResultBtn");
    
    totalSpan.innerText = TOTAL;

    // 更新统计栏 (选项计数 + 进度)
    function updateStats() {
        let answered = 0, aC=0,bC=0,cC=0,dC=0;
        for(let i=0;i<TOTAL;i++){
            const v = answers[i];
            if(v!==null){
                answered++;
                if(v===0) aC++;
                else if(v===1) bC++;
                else if(v===2) cC++;
                else if(v===3) dC++;
            }
        }
        answeredSpan.innerText = answered;
        document.getElementById("statA").innerHTML = `🌱 A:${aC}`;
        document.getElementById("statB").innerHTML = `🍂 B:${bC}`;
        document.getElementById("statC").innerHTML = `🍁 C:${cC}`;
        document.getElementById("statD").innerHTML = `🪨 D:${dC}`;
        document.getElementById("statNull").innerHTML = `⚪ 未选:${TOTAL-answered}`;
    }

    // 四维度分数计算
    function computeDimScores() {
        let scores = { EI:0, SN:0, TF:0, JP:0 };
        for(let i=0;i<TOTAL;i++){
            const ans = answers[i];
            if(ans === null) continue;
            const q = QUESTIONS[i];
            let point = 0;
            if(ans===0) point = q.sA;
            else if(ans===1) point = q.sB;
            else if(ans===2) point = q.sC;
            else point = q.sD;
            if(q.dim === "EI") scores.EI += point;
            else if(q.dim === "SN") scores.SN += point;
            else if(q.dim === "TF") scores.TF += point;
            else scores.JP += point;
        }
        return scores;
    }

    function getLetterAndStrength(score, first, second){
        if(score > 0) return { letter: first, strength: getStrength(score) };
        if(score < 0) return { letter: second, strength: getStrength(-score) };
        return { letter: "平衡", strength: "无倾向" };
    }
    function getStrength(absScore){
        if(absScore <= 2) return "轻微";
        if(absScore <= 5) return "中等";
        return "强烈";
    }

    // ---------- 玉石映射 + 对应图片路径 + 详细文化介绍 ----------
    const JADE_IMG_MAP = {
        "和田玉": "images/hetianyu.png",
        "翡翠": "images/feicui.png",
        "青金石": "images/qingjinshi.png",
        "玛瑙": "images/manao.png",
        "琥珀": "images/hupo.png",
        "独山玉": "images/dushanyu.png"
    };
    
    // 玉石文化库 (包含历史、寓意、传统)
    const JADE_CULTURE = {
        "和田玉": { 
            title: "🏔️ 帝王之玉 · 和田玉",
            content: "外貌上，和田玉质地温润细腻，呈油脂或蜡状光泽，半透明至不透明。颜色丰富，以白色为主，尤以“羊脂白玉”最为名贵，另有青、黄、墨等色。其硬度较高，韧性极强，适于精雕细琢。历史极为悠久，早在新石器时代即被先民使用，商周时期已大量开采，汉代丝绸之路开通后更成为东西方交流的重要商品。文化底蕴深厚，是中国“四大名玉”之首，被尊为“国玉”。儒家将其“温润而泽”的特性比作仁、义、智、勇等君子之德，故有“君子比德于玉”之说。历代皇室与文人雅士皆以佩玉为尚，玉器不仅是礼器、饰品，更承载着祈福、辟邪与身份象征的精神功能。"
        },
        "翡翠": { 
            title: "🐉 东方瑰宝 · 翡翠",
            content: "外貌上，翡翠是一种硬玉矿物集合体，呈玻璃光泽至油脂光泽，半透明至不透明。颜色丰富，以绿色为贵，分为帝王绿、苹果绿等，另有白、紫、红、黄、黑等色。质地细腻坚韧，硬度较高，结构常见纤维交织状。历史相对年轻，明代中期由缅甸传入中国，清代因乾隆、慈禧等皇室推崇而迅速盛行，成为传统玉文化的后起之秀。文化底蕴深厚，翡翠集中体现了“玉文化”的世俗美学与财富象征。其绿色象征生机与富贵，紫色象征祥瑞，红色代表喜庆。翡翠雕刻多采用谐音或隐喻题材（如福豆、如意、貔貅），寄托升官发财、多子多福等美好愿望。在华人世界，翡翠不仅是首饰，更被视为传家之宝，凝聚家族情感。"
        },
        "青金石": { 
            title: "🌌 天光石 · 青金石",
            content: "外貌上，青金石为不透明至半透明的岩石，呈深蓝色、紫蓝色或天青色，常有金色黄铁矿星点（称为“金”），质地细腻时可呈现均匀的纯色块体，具有玻璃至油脂光泽。历史极为古老，早在公元前7000年的中亚地区即被开采。古埃及将其视为圣石，用于制作法老面具、圣甲虫护身符；古代两河流域与波斯亦以青金石为珍贵颜料与宝石。文化底蕴深厚，在中国，青金石自古被称为“璆琳”“金碧”，汉代通过丝绸之路传入，多用于制作朝珠、翎管、摆件及佛教器物。清代因皇帝崇尚藏传佛教，青金石被定为四品官服朝珠材质，象征天威与权威。佛教中青金石以其深蓝色对应“药师佛”身色，有祛病护身之寓意。"
        },
        "玛瑙": { 
            title: "🎨 巧思之玉 · 玛瑙",
            content: "外貌上，玛瑙为玉髓类矿物，呈玻璃光泽，半透明至不透明。最典型特征为同心层状、条带状或波纹状纹理，色彩丰富，红、蓝、绿、白、黑等色常交替出现。质地坚硬致密，断口贝壳状。历史源远流长，新石器时代即被用于制作珠饰与工具。古代中国、印度、波斯、罗马均有使用，中世纪欧洲贵族将其用于镶嵌圣物盒与印章。文化底蕴丰富，在中国，玛瑙古称“琼玉”“赤玉”，佛教七宝之一，象征长寿与吉祥。因“玛瑙”谐音“马脑”，古人附会为良马之脑所化，赋予其勇猛与忠诚。玛瑙的条带纹理被解读为阴阳调和、循环往复的宇宙规律。民间常以红玛瑙为辟邪护身之物，亦多用于制作鼻烟壶、笔洗等文房雅器。"
        },
        "琥珀": { 
            title: "🍂 时光胶囊 · 琥珀",
            content: "外貌上，琥珀为非晶质有机宝石，呈树脂光泽，透明至半透明。颜色以黄色、蜜黄、棕红为主，少数有蓝、绿等罕见色。内部常见动植物包裹体（如昆虫、树叶），形成“虫珀”，极具科研与观赏价值。历史源远流长，古代北欧及中国均有使用。欧洲新石器时代遗址中即出土琥珀饰品，中国则从商代开始有琥珀制品，汉代文献明确记载其来自西域或缅甸。文化底蕴丰富，在中国被视为“虎魄”，传说为老虎魂魄入地所化，有辟邪安神之效。佛教中琥珀列为七宝之一，象征洁净与智慧。西方则自古认为琥珀能驱病辟邪，古希腊人称其为“电子之石”。"
        },
        "独山玉": { 
            title: "⛰️ 中原古玉 · 独山玉",
            content: "外貌上，独山玉质地细腻，呈玻璃光泽或油脂光泽，半透明至不透明。颜色极为丰富，有白、绿、紫、黄、红、黑等数十种色调，常多色混杂于同一块料石中，形成独特的斑驳纹理，硬度较高，韧性强。历史极为悠久，是中国“四大名玉”之一，早在新石器时代晚期即被南阳地区先民开采制作。河南南阳黄山遗址出土了大量独山玉玉器，证明其至少7000年的使用史。安阳殷墟妇好墓中也有多件独山玉制品。文化底蕴深厚，独山玉与中原文明发展紧密相连。因产自河南南阳独山，又称“南阳玉”。历代被用于制作礼器、佩饰、葬玉及生活用具。其多色特性使玉雕艺人能巧借颜色进行“俏色”创作，形成了独特的工艺传统。在民间，独山玉被认为具有辟邪护宅、吉祥如意的灵力，至今仍是中原玉文化的重要代表。"

    function mapToJade(eiLetter, snLetter, tfLetter, jpLetter){
        const combo = (eiLetter||'') + (snLetter||'') + (tfLetter||'') + (jpLetter||'');
        const jades = {
            "和田玉": { desc: "温润内敛，谦谦君子。你像和田玉一样沉稳而富有涵养，含蓄中透着坚定，包容且有原则。", traits: "温和、成熟、平衡、重内涵" },
            "翡翠": { desc: "翠色阳刚，灵透果决。你拥有翡翠般的锐气与生命力，果断坚韧，同时又懂得审时度势，充满激情与力量。", traits: "果断、敏锐、生机勃勃、敢于突破" },
            "青金石": { desc: "深邃如星空，理智且深邃。你追求真理与智慧，冷静从容，气质高贵，善于规划并充满洞察力。", traits: "理性、深邃、沉静、有远见" },
            "玛瑙": { desc: "缤纷坚韧，适应多变。你像玛瑙一样多彩且富有弹性，灵活应对变化，兼具感性与务实，温暖又通达。", traits: "灵活、包容、务实、善社交" },
            "琥珀": { desc: "温暖怀旧，富有共情力。你如琥珀般温润亲和，珍视情感，能给人带来安定感，内心蕴藏古老智慧。", traits: "温暖、细腻、重情义、治愈" },
            "独山玉": { desc: "质朴有力，刚柔并济。你兼具实用主义与创造精神，低调却蕴含力量，能于平凡中造就非凡。", traits: "坚韧、务实、创造、接地气" }
        };
        if(combo === "ESTJ" || combo === "ENTJ" || combo === "ISTJ") return { jade: "翡翠", ...jades["翡翠"] };
        if(combo === "INTJ" || combo === "INTP" || combo === "ENTP") return { jade: "青金石", ...jades["青金石"] };
        if(combo === "ENFJ" || combo === "ENFP" || combo === "ESFJ") return { jade: "琥珀", ...jades["琥珀"] };
        if(combo === "ISFP" || combo === "INFP" || combo === "INFJ") return { jade: "独山玉", ...jades["独山玉"] };
        if(combo === "ESTP" || combo === "ESFP" || combo === "ISTP") return { jade: "玛瑙", ...jades["玛瑙"] };
        return { jade: "和田玉", ...jades["和田玉"] };
    }

    // 刷新界面仅显示结果 (隐藏整个测试容器，在resultContainer中展示最终卡片 + 文化介绍)
    function showResultOnly() {
        const scores = computeDimScores();
        const ei = getLetterAndStrength(scores.EI, "E", "I");
        const sn = getLetterAndStrength(scores.SN, "S", "N");
        const tf = getLetterAndStrength(scores.TF, "T", "F");
        const jp = getLetterAndStrength(scores.JP, "J", "P");
        
        let typeRaw = "";
        typeRaw += (ei.letter === "平衡" ? "X" : ei.letter);
        typeRaw += (sn.letter === "平衡" ? "X" : sn.letter);
        typeRaw += (tf.letter === "平衡" ? "X" : tf.letter);
        typeRaw += (jp.letter === "平衡" ? "X" : jp.letter);
        let displayType = typeRaw;
        
        const jadeResult = mapToJade(ei.letter==="平衡"?null:ei.letter, sn.letter==="平衡"?null:sn.letter, tf.letter==="平衡"?null:tf.letter, jp.letter==="平衡"?null:jp.letter);
        const jadeImgSrc = JADE_IMG_MAP[jadeResult.jade] || "https://placehold.co/200x200?text=灵石";
        const culture = JADE_CULTURE[jadeResult.jade] || { title: "📜 灵石文化", content: "玉乃山川之精华，中外文明都赋予其纯洁、坚韧、吉祥之意，承载着世代的人文信仰。" };
        
        const resultHTML = `
            <div class="result-card">
                <div style="display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 12px;">
                    <div class="jade-badge">
                        <img class="jade-image" src="${jadeImgSrc}" alt="${jadeResult.jade}" onerror="this.src='https://placehold.co/200x200?text=玉石'">
                        <span>💎 ${jadeResult.jade}</span>
                    </div>
                    <span style="background:#ddd0b0; border-radius:30px; padding:4px 16px; font-size:0.8rem;">⚡ 气质组合 · ${displayType}</span>
                </div>
                <div class="dimension-row">
                    <div class="dim-item">🌊 内外向: ${ei.letter} (${scores.EI}分 · ${ei.strength})</div>
                    <div class="dim-item">🌿 感知模式: ${sn.letter} (${scores.SN}分 · ${sn.strength})</div>
                    <div class="dim-item">🔥 决策风格: ${tf.letter} (${scores.TF}分 · ${tf.strength})</div>
                    <div class="dim-item">📐 生活态度: ${jp.letter} (${scores.JP}分 · ${jp.strength})</div>
                </div>
                <hr style="background:#e1d3bd; margin:12px 0;">
                <p style="font-size:1.1rem; font-weight:500;">✨ 玉石寄语 ✨</p>
                <p style="margin-top:8px; line-height:1.5;">${jadeResult.desc}</p>
                <p style="margin-top:16px; background:#ebdfc9; border-radius:30px; padding:6px 16px; display:inline-block;">🍃 核心气质 · ${jadeResult.traits}</p>
                
                <!-- 玉石文化专栏 (新增) -->
                <div class="culture-section">
                    <h4>${culture.title}</h4>
                    <p>📖 ${culture.content}</p>
                </div>
                <div style="margin-top: 18px; text-align: center;">
                    <button id="retryBtnFromResult" class="btn-primary retry-btn" style="background: #5f7c4b;">🔄 重新测试</button>
                </div>
                <p style="margin-top: 20px; font-size:0.7rem; color:#8f7652; text-align:center;">※ 总分>0取首字母，<0取次字母，强度基于绝对值。玉石映射结合四维组合与心性格局，文化板块来自传统文献。</p>
            </div>
        `;
        
        testContainer.style.display = "none";
        resultContainerDiv.style.display = "block";
        resultContainerDiv.innerHTML = resultHTML;
        
        const retryBtn = document.getElementById("retryBtnFromResult");
        if(retryBtn) {
            retryBtn.addEventListener("click", () => {
                answers.fill(null);
                renderQuestions();
                updateStats();
                testContainer.style.display = "block";
                resultContainerDiv.style.display = "none";
                resultContainerDiv.innerHTML = "";
                document.querySelector('.test-container')?.scrollIntoView({ behavior: "smooth", block: "start" });
            });
        }
    }

    // 渲染所有题目 (一页滚动)
    function renderQuestions() {
        let html = '';
        QUESTIONS.forEach((q, idx) => {
            const selectedVal = answers[idx];
            html += `
                <div class="question-card" data-qidx="${idx}">
                    <div class="q-title">
                        <span>${idx+1}. ${escapeHtml(q.text)}</span>
                    </div>
                    <div class="options-row" id="opts-${idx}">
                        ${q.options.map((opt, optIdx) => {
                            const letter = String.fromCharCode(65+optIdx);
                            const active = (selectedVal === optIdx) ? 'opt-active' : '';
                            return `<div class="opt-btn ${active}" data-q="${idx}" data-opt="${optIdx}">${letter}. ${escapeHtml(opt)}</div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        });
        questionsArea.innerHTML = html;
        document.querySelectorAll('.opt-btn').forEach(btn => {
            btn.removeEventListener('click', handleClick);
            btn.addEventListener('click', handleClick);
        });
        updateStats();
    }

    function handleClick(e) {
        const btn = e.currentTarget;
        const qIdx = parseInt(btn.getAttribute('data-q'));
        const optVal = parseInt(btn.getAttribute('data-opt'));
        if(isNaN(qIdx) || isNaN(optVal)) return;
        answers[qIdx] = optVal;
        const container = document.getElementById(`opts-${qIdx}`);
        if(container){
            const btns = container.querySelectorAll('.opt-btn');
            btns.forEach(b => {
                let val = parseInt(b.getAttribute('data-opt'));
                if(val === optVal) b.classList.add('opt-active');
                else b.classList.remove('opt-active');
            });
        }
        updateStats();
    }

    function resetTest() {
        answers.fill(null);
        renderQuestions();
        updateStats();
        questionsArea.scrollTop = 0;
        if(testContainer.style.display === "none") {
            testContainer.style.display = "block";
            resultContainerDiv.style.display = "none";
            resultContainerDiv.innerHTML = "";
        }
    }

    function checkAndShowResult() {
        const unanswered = answers.filter(a => a === null).length;
        if(unanswered > 0){
            if(!confirm(`还有 ${unanswered} 题未选，未选题目不计分可能影响准确性，仍要查看玉石结果吗？`)) return;
        }
        showResultOnly();
    }

    function escapeHtml(str){
        return str.replace(/[&<>]/g, function(m){
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    function init() {
        renderQuestions();
        resetBtn.addEventListener('click', resetTest);
        viewBtn.addEventListener('click', checkAndShowResult);
    }
    init();
</script>
